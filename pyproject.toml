[build-system]
requires = ["setuptools>=77"]  # 77: the SPDX `license` string
build-backend = "setuptools.build_meta"

[project]
name = "role-radar"
dynamic = ["version"]
description = "Monitor company careers pages and alert on newly posted matching jobs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
role-radar = "role_radar.cli:main"

[project.optional-dependencies]
# DynamoDB state, config in S3, secrets in SSM. (Lambda's Python runtime already has boto3.)
aws = ["boto3[crt]>=1.34"] # CRT supports browser-based `aws login` profiles on the laptop.

[tool.setuptools.dynamic]
version = { attr = "role_radar.__version__" }

[tool.setuptools.packages.find]
include = ["role_radar*"]

[tool.setuptools.package-data]
# directory.yaml (known employers' job boards) is written by scripts/package_app.sh
role_radar = ["templates/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
