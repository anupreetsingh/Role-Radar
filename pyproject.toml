[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "role-radar"
dynamic = ["version"]
description = "Monitor company careers pages and alert on newly posted matching jobs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
role-radar = "role_radar.cli:main"

[project.optional-dependencies]
# DynamoDB state, config in S3, secrets in SSM. (Lambda's Python runtime already has boto3.)
aws = ["boto3>=1.34"]

[tool.setuptools.dynamic]
version = { attr = "role_radar.__version__" }

[tool.setuptools.packages.find]
include = ["role_radar*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
