# Your Role Radar profile: your own settings, applied over companies.yaml.
#
# Copy this file to config/profile.yaml (git ignores that name) and make it yours:
# the roles and places you want under `filters`, the most years of experience a
# job may ask for, and where Role Radar keeps its state and your alert settings.
# See the README's "Run it on your Mac" section.

# Where state and alert settings live. Mac-only: everything stays on this Mac.
#   storage: sqlite     seen jobs, alerts and switches in ~/.role-radar/state.db
#   secrets: keychain   email and Discord settings in the Keychain, set with
#                       `role-radar secrets set NAME` (see the README)
runtime:
  storage: sqlite
  secrets: keychain

# To also check while this Mac is off, deploy the AWS stack (README: "Add AWS")
# and replace the runtime section above with its outputs:
# runtime:
#   storage: dynamodb
#   table: role-radar-StateTable-XXXXXXXX
#   config_url: s3://role-radar-configbucket-xxxxxxxx/companies.yaml
#   secrets: ssm:/role-radar/
#   region: us-east-1
#   profile: role-radar

# What to look for. Each key replaces the same key for every company in
# companies.yaml (a company's own `filters:` can still override one). Keys:
#   include_keywords   any one must appear in the job title
#   exclude_keywords   none may appear in it
#   locations          allow-list matched against the location ("remote" works too)
#   max_experience_years  read each new match's description once, and don't alert
#                      those asking for more years than this (null: don't read)
# Matching is case-insensitive, on word boundaries ("AI" won't match "maintain").
# Prefix a keyword with "re:" to use a regular expression.
filters:
  # An example set, tuned to one person's resume: backend/full-stack software
  # engineering, AI and LLM applications, ML, data engineering, cloud/platform work,
  # and C++ systems, performance and graphics. Replace it with the roles you want.
  # These are title matches, not eligibility checks: experience, degree, graduation
  # window and work authorization requirements still need review in each job.
  include_keywords:
    # Application development (spaces also match hyphens or no separator).
    - software engineer
    - software engineering
    - software development
    - developer
    - programmer
    - SWE
    - SDE
    - full stack
    - front end
    - back end
    - web engineer
    - UI engineer
    - Python engineer
    - product engineer
    - application engineer
    - integration engineer
    - integrations engineer
    # Platforms, cloud infrastructure and developer tooling.
    - platform engineer
    - platforms engineer
    - platform engineering
    - cloud engineer
    - infrastructure engineer
    - site reliability
    - SRE
    - DevOps
    - DevSecOps
    - production engineer
    - build engineer
    - release engineer
    - tools engineer
    # Distributed systems, compilers, performance and graphics.
    - distributed systems
    - systems development
    - compiler
    - toolchain engineer
    - runtime engineer
    - kernel engineer
    - performance engineer
    - GPU engineer
    - graphics engineer
    - rendering engineer
    - computer graphics
    - gameplay engineer
    - algorithm engineer
    - algorithms engineer
    - high performance computing
    - HPC engineer
    - member of technical staff
    - member technical staff
    - associate technical staff
    # AI, LLM applications, ML and applied research.
    - machine learning
    - ML engineer
    - MLOps
    - LLMOps
    - AI engineer
    - AI engineering
    - applied AI
    - artificial intelligence
    - generative AI
    - gen AI engineer
    - LLM engineer
    - agent engineer
    - agents engineer
    - AI agent
    - AI agents
    - conversational AI
    - deep learning
    - NLP engineer
    - natural language processing
    - computer vision
    - perception engineer
    - inference engineer
    - search engineer
    - information retrieval
    - research engineer
    - applied scientist
    - AI residency
    # Data engineering and data science.
    - data engineer
    - data engineering
    - data scientist
    - data science
    - analytics engineer
    - database engineer
    - ETL engineer
    # Compliance tooling, like the NIST 800-53 audit platform.
    - GRC engineer
    # Test automation.
    - SDET
    - QA engineer
    - quality assurance engineer
    - QA automation
    - test automation
    - software test
    # Technical program management and product management.
    - technical program manager
    - technical program management
    - associate product manager
    - product manager
    # Business analysis.
    - business analyst
    - business systems analyst
    # Customer-facing engineering: forward deployed, AI deployment and solutions.
    - forward deployed engineer
    - forward deployment engineer
    - AI deployment engineer
    - solutions engineer
    - solution engineer
    - solutions architect
    - solution architect
    # Employer-specific graduate/rotation programs with nonstandard titles.
    - engineering development group
    - EDG
    - technology development program
    - technology analyst program
    - technical development program
    - software development program
    - technology graduate
  exclude_keywords:
    - senior
    - sr
    # A word here never rules out an include keyword it's part of: "Member of Technical Staff"
    # (an early-career title) stays, and so do product and technical program managers.
    - staff
    - principal
    - distinguished
    - lead
    - 're:\bmanagers?\b'
    - director
    - vice president
    - vp
    - head of
    - chief
    - president
    - officer
    # Off-profile titles the broad keywords above also catch: ERP/CRM platform
    # developers, technical writing, and hardware or manufacturing roles.
    - 're:\b(?:ServiceNow|SAP|ABAP|Pega|MuleSoft|PeopleSoft|Fiori|Power[\s-]*Platform)\b'
    - 're:\bSalesforce[\s/_-]+(?:developer|engineer|architect|administrator|consultant)\b'
    - 're:\b(?:courseware|content|documentation|information|course|curriculum|certification)[\s/_-]+developer\b'
    - 're:\b(?:firmware|BIOS|UEFI|PCB|FPGA|ASIC|RTL|CNC|CMM|PLC|HVAC)\b'
    - design release
    - process integration
    - supplier
    - technician
  match_on: [title]
  exclude_on: [title]
  # New matches whose description asks for more years of experience are recorded, not
  # alerted. A master's counts where the posting allows it ("3+ years, or 1+ with an MS").
  # A description that is unclear or can't be read keeps the job.
  max_experience_years: 2
  # Target countries, plus regional/city names used by boards that omit countries.
  # Unqualified Remote/Worldwide listings need a country-eligibility check.
  locations:
    - United States
    - USA
    - US
    - Canada
    - Australia
    - India
    - 're:\b(?-i:US|USA|CAN|AU|AUS|IND)\b'
    - 're:^(?-i:IN|CA)-'
    - 're:\b(?:Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming|District of Columbia)\b'
    - 're:(?:,\s*|\s-\s)(?-i:AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC|AB|BC|MB|NB|NL|NS|NT|NU|ON|PE|QC|SK|YT|NSW|VIC|QLD|ACT|SA|TAS)\b'
    - 're:\b(?:Ontario|Quebec|Québec|British Columbia|Alberta|Manitoba|Saskatchewan|Nova Scotia|New Brunswick|Newfoundland|Toronto|Vancouver|Montréal|Montreal|Ottawa|Waterloo|Kitchener|Calgary|Edmonton|Winnipeg|Halifax)\b'
    - 're:\b(?:Sydney|Melbourne|Brisbane|Perth|Adelaide|Canberra|Hobart|New South Wales|Victoria|Queensland|Tasmania)\b'
    - 're:\b(?:Bangalore|Bengaluru|Hyderabad|Pune|Mumbai|Delhi|Noida|Gurgaon|Gurugram|Chennai|Kolkata|Ahmedabad|Jaipur|Kochi|Thiruvananthapuram|Chandigarh|Indore|Coimbatore)\b'
    - 're:\b(?:San Francisco|Bay Area|San Jose|Palo Alto|Mountain View|Sunnyvale|Redwood City|Menlo Park|Seattle|Bellevue|Redmond|Boston|Cambridge|Natick|Austin|Dallas|Houston|Chicago|Los Angeles|San Diego|New York City|NYC|Brooklyn|Atlanta|Denver|Boulder|Portland|Raleigh|Durham|Cary|Charlotte|Baltimore|Bethesda|Rockville|Reston|Arlington|McLean|Herndon|Philadelphia|Pittsburgh|Cleveland|Columbus|Cincinnati|Detroit|Ann Arbor|Minneapolis|Madison|Verona|Olathe|San Antonio|Tampa|Orlando|Miami|Phoenix|Salt Lake City|Nashville)\b(?!,?\s*(?:UK|United Kingdom|England|New Zealand|Germany))'
    - 're:^(?:remote|anywhere|worldwide|global)(?:\s*[/,-]\s*(?:remote|anywhere|worldwide|global))*\s*$'
