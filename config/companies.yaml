# Role Radar company configuration.
#
# Per company:
#   name      (required) display name; also the key in the state store, so renaming
#             a company re-baselines it
#   url       (required) public careers page
#   ats       optional: bamboohr | greenhouse | lever | ashby | workday | icims | jibe |
#             avature | hrmdirect | recruiterbox | eightfold | oracle_hcm | amazon |
#             apple | google | meta | tiktok | mathworks | comsol | generic
#             (auto-detected from the URL when omitted)
#   filters   optional; each key REPLACES the same key from defaults.filters
#   options   optional scraper-specific settings (see each scraper's docstring)
#   enabled   optional, default true
#   max_alert_age_days  optional: record, don't alert, new matches posted longer ago
#
# Filter keys:
#   include_keywords   any one must appear in the `match_on` fields
#   exclude_keywords   none may appear in the `exclude_on` fields
#   match_on / exclude_on   any of: title, location, employment_type, department
#                      (keywords never match job descriptions)
#   locations          optional allow-list matched against location ("remote" works too)
#   employment_types   optional allow-list, e.g. ["full-time", "full time"]
#   max_experience_years  optional: read each new match's description once, and record
#                      without alerting those asking for more years (null: don't read)
# Matching is case-insensitive, on word boundaries ("AI" won't match "maintain").
# Prefix a keyword with "re:" to use a regular expression.

# Where state, this config and alert secrets live. Environment variables override
# each key: ROLE_RADAR_STORAGE, ROLE_RADAR_STATE_FILE, ROLE_RADAR_TABLE,
# ROLE_RADAR_CONFIG_URL, ROLE_RADAR_SECRETS, AWS_REGION, AWS_PROFILE.
runtime:
  storage: dynamodb
  state_file: seen_jobs.json
  table: role-radar-StateTable-UVW1FTNH6RAD
  config_url: s3://role-radar-configbucket-sgxptx7mtuif/companies.yaml
  secrets: ssm:/role-radar/
  region: us-east-1
  profile: role-radar  # the laptop IAM user (permanent key); role-radar-admin is only for sam deploy

settings:
  # Target: a new job reaches you within 30 minutes (check every 20 + digest every 10).
  check_interval_minutes: 20  # each company is checked when due, so load spreads across the interval
  digest_interval_minutes: 10 # combine all new matching jobs into one notification every 10 minutes
  notify_on_first_run: false  # new companies record a baseline first; set true to alert on their open jobs
  repost_window_days: 30
  retention_days: 90
  max_detail_requests: 25
  max_company_concurrency: 40   # companies in flight; requests are limited separately below
  company_timeout: 300
  # Workday boards take a request per 20 jobs, so they're checked less often and two at
  # a time: roughly 4,500 requests per round, spread over four hours.
  check_interval_by_ats:
    workday: 240
  # Between those full checks, a quick check every 10 minutes reads only a Workday board's
  # newest page (one request), and reads further only while its jobs are new. Most boards
  # list newest first; new jobs on the few that don't wait for the 4-hourly full check.
  quick_check_by_ats:
    workday: 10
  company_concurrency_by_ats:
    workday: 2
  http:
    max_concurrency: 16         # requests in flight across all hosts
    per_domain_delay: 1.0       # seconds between requests to one host...
    host_delays:                # ...except these shared ATS APIs (these are also the built-in defaults)
      boards-api.greenhouse.io: 0.25
      api.lever.co: 0.3
      api.eu.lever.co: 0.3
      api.ashbyhq.com: 0.3
      # Every company's Workday tenant is a subdomain of these. A parent-domain key
      # spaces all of its subdomains as one host, so ~150 tenants together make about
      # 2 requests/s to Workday at most. A 429 from any of them pauses all of them.
      myworkdayjobs.com: 0.5
      myworkdaysite.com: 1.0
      # Eightfold search APIs rate-limit quickly (Microsoft answered 429 on a second request).
      apply.careers.microsoft.com: 3.0
      explore.jobs.netflix.net: 2.0
      eightfold.ai: 2.0         # all *.eightfold.ai tenants share this rate
      www.metacareers.com: 0.25 # Meta's catch-up reads ~1,000 job pages; new ones after that
    connect_timeout: 10
    read_timeout: 30
    max_retries: 3
    respect_robots: true

defaults:
  filters:
    # Broad discovery for a spring-2026 MS CS graduate. These are title matches,
    # not eligibility checks: experience, degree, graduation window and work
    # authorization requirements still need review in each job description.
    include_keywords:
      # Application development (spaces also match hyphens or no separator).
      - software engineer
      - software engineering
      - software development
      - developer
      - programmer
      - SWE
      - SDE
      - full stack
      - front end
      - back end
      - web engineer
      - mobile engineer
      - iOS engineer
      - Android engineer
      - application engineer
      - applications engineer
      - product engineer
      - integration engineer
      - integrations engineer
      # Platforms, cloud infrastructure and developer tooling.
      - platform engineer
      - platforms engineer
      - platform engineering
      - cloud engineer
      - cloud operations
      - infrastructure engineer
      - site reliability
      - SRE
      - DevOps
      - DevSecOps
      - production engineer
      - build engineer
      - release engineer
      - tools engineer
      # Compilers, operating systems, embedded and performance work.
      - compiler
      - toolchain engineer
      - runtime engineer
      - kernel engineer
      - systems engineer
      - system engineer
      - systems development
      - embedded engineer
      - embedded software
      - firmware
      - distributed systems
      - performance engineer
      - GPU engineer
      - graphics engineer
      - rendering engineer
      - robotics engineer
      - simulation engineer
      - algorithm engineer
      - algorithms engineer
      - high performance computing
      - HPC engineer
      - member of technical staff
      - member technical staff
      - associate technical staff
      # AI, applied research, data and analytics.
      - machine learning
      - ML engineer
      - MLOps
      - AI engineer
      - AI engineering
      - applied AI
      - artificial intelligence
      - generative AI
      - LLM engineer
      - NLP engineer
      - natural language processing
      - computer vision
      - research engineer
      - research scientist
      - applied scientist
      - data engineer
      - data engineering
      - data scientist
      - data science
      - data analyst
      - analytics engineer
      - analytics analyst
      - business intelligence
      - BI engineer
      - BI analyst
      - database engineer
      - database administrator
      - ETL engineer
      - quantitative analyst
      - quantitative researcher
      # Security, networking and IT systems.
      - security engineer
      - security analyst
      - cybersecurity
      - cyber security
      - information security
      - SOC analyst
      - penetration tester
      - detection engineer
      - network engineer
      - network development
      - network administrator
      - systems administrator
      - system administrator
      - systems analyst
      - system analyst
      - IT analyst
      # Software quality and test automation.
      - SDET
      - QA engineer
      - QA analyst
      - quality assurance engineer
      - quality assurance analyst
      - software quality
      - test engineer
      - test automation
      - automation engineer
      - software tester
      # Product and technical delivery: "manager" need not mean people manager.
      - product manager
      - product management
      - product owner
      - product analyst
      - technical program manager
      - technical program management
      - technical project manager
      - technical project management
      - business analyst
      - business systems analyst
      # Customer-facing engineering and technical implementation.
      - solutions engineer
      - solution engineer
      - solutions architect
      - solution architect
      - implementation engineer
      - implementation consultant
      - technical consultant
      - technology consultant
      - support engineer
      - cloud support
      - application support
      - technical support analyst
      - customer engineer
      - customer success engineer
      - forward deployed engineer
      # Employer-specific graduate/rotation programs with nonstandard titles.
      - engineering development group
      - EDG
      - technology development program
      - technology analyst program
      - technical development program
      - software development program
      - technology graduate
    exclude_keywords:
      - senior
      - sr
      # "Member of Technical Staff" can be an early-career title.
      - 're:^(?!.*\b(?:member|associate)\b.*\btechnical[\s/_-]+staff\b).*\bstaff\b'
      - principal
      - distinguished
      - lead
      # Permit product/technical program/project managers, exclude other managers.
      - 're:^(?!.*\b(?:product|technical[\s/_-]+(?:program|project))[\s/_-]+manager\b).*\bmanagers?\b'
      - director
      - vice president
      - vp
      - head of
      - chief
      - president
      - officer
    match_on: [title]
    exclude_on: [title]
    # New matches whose description asks for more years of experience are recorded, not
    # alerted. A master's counts where the posting allows it ("3+ years, or 1+ with an MS").
    # A description that is unclear or can't be read keeps the job.
    max_experience_years: 2
    # Target countries, plus regional/city names used by boards that omit countries.
    # Unqualified Remote/Worldwide listings need a country-eligibility check.
    locations:
      - United States
      - USA
      - US
      - Canada
      - Australia
      - India
      - 're:\b(?-i:US|USA|CAN|AU|AUS|IND)\b'
      - 're:^(?-i:IN|CA)-'
      - 're:\b(?:Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming|District of Columbia)\b'
      - 're:(?:,\s*|\s-\s)(?-i:AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC|AB|BC|MB|NB|NL|NS|NT|NU|ON|PE|QC|SK|YT|NSW|VIC|QLD|ACT|SA|TAS)\b'
      - 're:\b(?:Ontario|Quebec|Québec|British Columbia|Alberta|Manitoba|Saskatchewan|Nova Scotia|New Brunswick|Newfoundland|Toronto|Vancouver|Montréal|Montreal|Ottawa|Waterloo|Kitchener|Calgary|Edmonton|Winnipeg|Halifax)\b'
      - 're:\b(?:Sydney|Melbourne|Brisbane|Perth|Adelaide|Canberra|Hobart|New South Wales|Victoria|Queensland|Tasmania)\b'
      - 're:\b(?:Bangalore|Bengaluru|Hyderabad|Pune|Mumbai|Delhi|Noida|Gurgaon|Gurugram|Chennai|Kolkata|Ahmedabad|Jaipur|Kochi|Thiruvananthapuram|Chandigarh|Indore|Coimbatore)\b'
      - 're:\b(?:San Francisco|Bay Area|San Jose|Palo Alto|Mountain View|Sunnyvale|Redwood City|Menlo Park|Seattle|Bellevue|Redmond|Boston|Cambridge|Natick|Austin|Dallas|Houston|Chicago|Los Angeles|San Diego|New York City|NYC|Brooklyn|Atlanta|Denver|Boulder|Portland|Raleigh|Durham|Cary|Charlotte|Baltimore|Bethesda|Rockville|Reston|Arlington|McLean|Herndon|Philadelphia|Pittsburgh|Cleveland|Columbus|Cincinnati|Detroit|Ann Arbor|Minneapolis|Madison|Verona|Olathe|San Antonio|Tampa|Orlando|Miami|Phoenix|Salt Lake City|Nashville)\b(?!,?\s*(?:UK|United Kingdom|England|New Zealand|Germany))'
      - 're:^(?:remote|anywhere|worldwide|global)(?:\s*[/,-]\s*(?:remote|anywhere|worldwide|global))*\s*$'

