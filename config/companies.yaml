        - 're:^(?!.*\b(?:product|technical[\s/_-]+(?:program|project))[\s/_-]+manager\b).*\bmanagers?\b'
        - director
        - vice president
        - vp
        - head of
        - chief
        - president
        - officer
      match_on: [title]
      exclude_on: [title]

