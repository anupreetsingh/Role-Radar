# Role Radar company configuration.
#
# Per company:
#   name      (required) display name; also the key in the state store, so renaming
#             a company re-baselines it
#   url       (required) public careers page
#   ats       optional: bamboohr | greenhouse | lever | ashby | workday | generic
#             (auto-detected from the URL when omitted)
#   filters   optional; each key REPLACES the same key from defaults.filters
#   options   optional scraper-specific settings (see each scraper's docstring)
#   enabled   optional, default true
#
# Filter keys:
#   include_keywords   any one must appear in the `match_on` fields
#   exclude_keywords   none may appear in the `exclude_on` fields
#   match_on / exclude_on   any of: title, location, employment_type, department
#                      (job descriptions are never downloaded, so they can't be matched)
#   locations          optional allow-list matched against location ("remote" works too)
#   employment_types   optional allow-list, e.g. ["full-time", "full time"]
# Matching is case-insensitive, on word boundaries ("AI" won't match "maintain").
# Prefix a keyword with "re:" to use a regular expression.

# Where state, this config and alert secrets live. Environment variables override
# each key: ROLE_RADAR_STORAGE, ROLE_RADAR_STATE_FILE, ROLE_RADAR_TABLE,
# ROLE_RADAR_CONFIG_URL, ROLE_RADAR_SECRETS, AWS_REGION, AWS_PROFILE.
runtime:
  storage: json               # json: local state_file | dynamodb: the shared table
  state_file: seen_jobs.json
  # table: role-radar                                           # storage: dynamodb
  # config_url: s3://role-radar-config-123456789012/companies.yaml  # companies read from here
  # secrets: ssm:/role-radar/                                   # env | ssm:/path/
  # region: us-east-1
  # profile: role-radar                                         # ~/.aws profile

settings:
  check_interval_minutes: 30  # each company is checked when due, so load spreads across the interval
  notify_on_first_run: true   # set false before adding many companies at once
  repost_window_days: 30
  retention_days: 90
  max_detail_requests: 25
  max_company_concurrency: 40   # companies in flight; requests are limited separately below
  company_timeout: 300
  http:
    max_concurrency: 16         # requests in flight across all hosts
    per_domain_delay: 1.0       # seconds between requests to one host...
    host_delays:                # ...except these shared ATS APIs (these are also the built-in defaults)
      boards-api.greenhouse.io: 0.25
      api.lever.co: 0.3
      api.eu.lever.co: 0.3
      api.ashbyhq.com: 0.3
    connect_timeout: 10
    read_timeout: 30
    max_retries: 3
    respect_robots: true

defaults:
  filters:
    include_keywords:
      - software engineer
      - backend engineer
      - platform engineer
      - machine learning engineer
      - AI engineer
      - data engineer
    exclude_keywords:
      - senior
      - sr
      - staff
      - principal
      - lead
      - manager
      - director
      - vice president
      - vp
      - head of
      - chief
    match_on: [title]
    exclude_on: [title]

companies:
  - name: Continental Finance
    url: https://contfinco.bamboohr.com/careers
    ats: bamboohr
    filters:
      include_keywords:
        - software engineer
        - software engineering
        - software developer
        - developer
        - backend
        - back end
        - platform engineer
        - platform engineering
        - machine learning
        - ML
        - MLOps
        - AI
        - artificial intelligence
        - data engineer
        - data engineering
      # Management/executive roles only. "senior" is deliberately NOT excluded here:
      # it would drop hybrid titles like "Mid/Senior Software Developer". Add it
      # back if you want entry/mid-level roles only.
      exclude_keywords:
        - manager
        - director
        - vice president
        - vp
        - head of
        - chief
        - president
        - officer
      match_on: [title]
      exclude_on: [title]

  # --- More examples (disabled). Enable and adjust as needed. ---------------

  - name: Discord
    url: https://job-boards.greenhouse.io/discord
    enabled: false

  - name: Palantir
    url: https://jobs.lever.co/palantir
    enabled: false
    filters:
      locations: [New York, Remote]

  - name: Ashby
    url: https://jobs.ashbyhq.com/ashby
    enabled: false

  - name: NVIDIA
    url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
    enabled: false
    options:
      search_text: software engineer new grad  # narrows thousands of jobs server-side
      max_jobs: 200
    filters:
      include_keywords: [software engineer, new grad, new college grad]
      locations: [US, United States]

  - name: Example Custom Site
    url: https://example.com/careers
    ats: generic
    enabled: false
    options:
      link_pattern: "/careers/jobs/\\d+"   # regex for job-detail links on the page
