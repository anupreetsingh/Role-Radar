# Written by Role Radar's setup. Add companies in the app (Settings), or by hand.
# How often and how politely each company is checked. The same settings as the
# project's config/companies.yaml.
settings:
  # Target: a new job reaches you within 30 minutes (check every 20 + digest every 10).
  check_interval_minutes: 20  # each company is checked when due, so load spreads across the interval
  digest_interval_minutes: 10 # combine all new matching jobs into one notification every 10 minutes
  notify_on_first_run: false  # new companies record a baseline first; set true to alert on their open jobs
  retention_days: 90
  max_detail_requests: 25
  max_company_concurrency: 40   # companies in flight; requests are limited separately below
  company_timeout: 300
  # Workday boards take a request per 20 jobs, so they're checked less often and two at
  # a time: with ~820 boards, roughly 9,000 requests per round, spread over six hours.
  check_interval_by_ats:
    workday: 360
  # Between those full checks, a quick check every 20 minutes reads only a Workday board's
  # newest page (one request), and reads further only while its jobs are new. Most boards
  # list newest first; new jobs on the few that don't wait for the 6-hourly full check.
  # Quick and full checks together average ~1.1 requests/s to Workday.
  quick_check_by_ats:
    workday: 20
  company_concurrency_by_ats:
    workday: 2
  http:
    max_concurrency: 16         # requests in flight across all hosts
    per_domain_delay: 1.0       # seconds between requests to one host...
    host_delays:                # ...except these shared ATS APIs (these are also the built-in defaults)
      boards-api.greenhouse.io: 0.25
      api.lever.co: 0.3
      api.eu.lever.co: 0.3
      api.ashbyhq.com: 0.3
      ats.rippling.com: 0.5
      # Every company's Workday tenant is a subdomain of these. A parent-domain key
      # spaces all of its subdomains as one host, so ~150 tenants together make about
      # 2 requests/s to Workday at most. A 429 from any of them pauses all of them.
      myworkdayjobs.com: 0.5
      myworkdaysite.com: 1.0
      # Eightfold search APIs rate-limit quickly (Microsoft answered 429 on a second request).
      apply.careers.microsoft.com: 3.0
      explore.jobs.netflix.net: 2.0
      eightfold.ai: 2.0         # all *.eightfold.ai tenants share this rate
      www.metacareers.com: 0.25 # Meta's catch-up reads ~1,000 job pages; new ones after that
    connect_timeout: 10
    read_timeout: 30
    max_retries: 3
    respect_robots: true

companies: []
