name: CI

# Tests only. Monitoring runs on the laptop (`role-radar start`), in the Mac and Windows apps, and on
# AWS Lambda (deploy/aws/template.yaml); state lives in DynamoDB or on the computer, not in this repo.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"] # the oldest supported, and Lambda's runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  windows:
    # Everything again on Windows, where the Windows app runs the checker (its Windows parts for real:
    # Credential Manager, the lock, stopping it), and the Windows app: built, its core tested, and
    # every text size and theme name it uses checked.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # the Windows app's Python
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build and test the Windows app
        run: |
          dotnet build windows/RoleRadar.sln -c Release
          dotnet test windows/RoleRadar.Core.Tests -c Release --no-build
          python windows/build.py check-app
